<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#F3EDE0;
  background:radial-gradient(120% 140% at 30% 40%,#1E3A29 0%,#132119 50%,#0C1410 100%)}
.cap{position:absolute;left:150px;top:50%;transform:translateY(-50%);width:760px}
.k{font-size:22px;font-weight:600;letter-spacing:.24em;color:#8FB497;margin-bottom:22px}
.h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:86px;line-height:.98;letter-spacing:-.01em}
.s{margin-top:26px;font-size:30px;line-height:1.35;color:#C8BFA8}
.phone{position:absolute;left:1220px;top:60px;width:470px;height:960px;border-radius:64px;background:#000;padding:14px;
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 2px #2A332E}
.screen{width:100%;height:100%;border-radius:52px;background:#000}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.a{animation-play-state:paused;opacity:0}
body.play .a{animation-play-state:running}
</style></head>
<body>
<div class="cap">
  <div class="k a" id="k" style="animation:up .6s .15s both"></div>
  <div class="h a" id="h" style="animation:up .7s .3s both"></div>
  <div class="s a" id="s" style="animation:up .7s .5s both"></div>
</div>
<div class="phone"><div class="screen"></div></div>
<script>
const C={
  B:["OPEN SAMAAN","Tap Capture<br>a recipe.","Record it, paste a link,<br>or type it."],
  C:["HIT RECORD","Just talk<br>it through.","Cook it out loud. Code-switched,<br>andaza and all."],
  S:["A FEW SECONDS","Words in.<br>Recipe out.","No typing. No measuring."],
  R:["REVIEW, THEN SAVE","Check it.<br>Save it.","Every ingredient, with the words<br>exactly as they were said."],
  E:["IN THE APP","Ready<br>to cook.","Ingredients and steps,<br>ready whenever you are."]
};
const c=C[new URLSearchParams(location.search).get('seg')];
document.getElementById('k').textContent=c[0];
document.getElementById('h').innerHTML=c[1];
document.getElementById('s').innerHTML=c[2];
</script>
</body></html>
