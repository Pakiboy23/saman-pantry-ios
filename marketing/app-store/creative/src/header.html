<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../fonts/fonts-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0}
.canvas{position:relative;width:1920px;height:823px;overflow:hidden;
 background:radial-gradient(125% 150% at 50% 36%, #27603C 0%, #1C4A2E 46%, #14361F 100%);
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#FDF8ED}
.wm{position:absolute;right:-70px;bottom:-170px;font-family:'Noto Nastaliq Urdu',serif;
 font-size:430px;line-height:1;color:#FDF8ED;opacity:.05;white-space:nowrap}
.rule{position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#CB8A2C,#6DA77F)}
.lockup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:54px}
.icon{width:154px;height:154px;border-radius:35px;box-shadow:0 22px 54px rgba(0,0,0,.42)}
.eyebrow{font-size:21px;font-weight:600;letter-spacing:.22em;color:#E8D4AB;margin-bottom:16px}
.head{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:88px;line-height:.97;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:18px;margin-top:20px}
.sub .ur{font-family:'Noto Nastaliq Urdu',serif;font-size:31px;color:#D7B86A;padding-bottom:12px}
.sub .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:34px;color:#E8D4AB}
</style></head><body><div class="canvas">
 <div class="rule"></div>
 <div class="wm" lang="ur" dir="rtl">سامان</div>
 <div class="lockup">
  <img class="icon" src="../../../../Saman/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png">
  <div>
   <div class="eyebrow">MADE FOR DESI KITCHENS</div>
   <div class="head">Family recipes,<br>word for word.</div>
   <div class="sub"><span class="ur" lang="ur" dir="rtl">اندازہ سے</span><span class="en">andaza and all</span></div>
  </div>
 </div>
</div></body></html>
